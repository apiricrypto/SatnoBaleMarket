name: v0.5 Staff CI

on:
  push:
    branches:
      - feature/staff-v05
  pull_request:
    branches:
      - feature/classifier-v03

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        env:
          DATABASE_PATH: /tmp/satno-market-ci.db
          SESSION_COOKIE_SECURE: "0"
        run: python -m unittest discover -s tests -v
      - name: Mock CRM adapter acceptance
        shell: bash
        run: |
          export SATNO_BALE_MARKET_INGEST_TOKEN="$(python -c 'print("x"*64)')"
          export SATNO_CRM_LEAD_URL="http://127.0.0.1:8099/functions/v1/ingest_leads"
          python tools/mock_crm_receiver.py >/tmp/satno-mock-crm.log 2>&1 &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true' EXIT
          sleep 1
          python tools/crm_adapter_acceptance.py
